name: Morita History Reconstruction

on:
  workflow_dispatch:
    inputs:
      include_repo_sources:
        description: "Parse raw sources already present in the repository"
        required: true
        default: true
        type: boolean
      include_github_action_artifacts:
        description: "Attempt to retrieve available GitHub Actions artifacts with actions:read"
        required: true
        default: false
        type: boolean
      build_underlying_outcomes:
        description: "Build reconstructed underlying outcome panel"
        required: true
        default: true
        type: boolean
      persist_reports:
        description: "Commit normalized reconstruction outputs and reports"
        required: true
        default: false
        type: boolean

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout analysis commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Snapshot input reconstruction source hashes before
        run: |
          python - <<'PY'
          from pathlib import Path
          import market_bomb_phase3_2b_morita_history_reconstruction as r
          r.write_input_source_hash_manifest(
              Path("."),
              Path("market_bomb_reconstruction/audit/input_source_hash_manifest_before.csv"),
              include_repo_sources="${{ inputs.include_repo_sources }}" == "true",
          )
          PY

      - name: Reconstruct Morita history
        run: |
          ARGS=""
          if [ "${{ inputs.include_repo_sources }}" != "true" ]; then
            ARGS="$ARGS --skip-repo-sources"
          fi
          if [ "${{ inputs.include_github_action_artifacts }}" = "true" ]; then
            ARGS="$ARGS --include-github-action-artifacts"
          fi
          if [ "${{ inputs.build_underlying_outcomes }}" != "true" ]; then
            ARGS="$ARGS --skip-underlying-outcomes"
          fi
          python market_bomb_phase3_2b_morita_history_reconstruction.py $ARGS

      - name: Verify input reconstruction sources were not mutated
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          import market_bomb_phase3_2b_morita_history_reconstruction as r
          before_path = Path("market_bomb_reconstruction/audit/input_source_hash_manifest_before.csv")
          after_path = Path("market_bomb_reconstruction/audit/input_source_hash_manifest_after.csv")
          before = pd.read_csv(before_path) if before_path.exists() else pd.DataFrame()
          after = r.input_source_hash_manifest(Path("."), include_repo_sources="${{ inputs.include_repo_sources }}" == "true")
          after_path.parent.mkdir(parents=True, exist_ok=True)
          after.to_csv(after_path, index=False)
          count, report = r.compare_input_source_manifests(before, after)
          Path("market_bomb_reconstruction/audit/input_source_mutation_report.txt").write_text(report, encoding="utf-8")
          Path("input_source_mutation_count.txt").write_text(f"input_source_mutation_count={count}\n", encoding="utf-8")
          Path("raw_source_mutation_count.txt").write_text(f"raw_source_mutation_count={count}\n", encoding="utf-8")
          Path("raw_source_mutation_report.txt").write_text(report, encoding="utf-8")
          if count:
              print(report)
              raise SystemExit(1)
          PY

      - name: Upload reconstruction artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morita-history-reconstruction-${{ github.run_id }}
          path: |
            market_bomb_reconstruction/source_inventory.csv
            market_bomb_reconstruction/source_inventory.md
            market_bomb_reconstruction/source_file_manifest.csv
            market_bomb_reconstruction/source_ingestion_audit.md
            market_bomb_reconstruction/normalized/*.csv
            market_bomb_reconstruction/normalized/*.parquet
            market_bomb_reconstruction/audit/*.csv
            market_bomb_reconstruction/audit/*.md
            market_bomb_reconstruction/audit/*.json
            market_bomb_reconstruction/audit/*.txt
            market_bomb_reconstruction/analysis/*.csv
            market_bomb_reconstruction/analysis/*.parquet
            market_bomb_reconstruction/analysis/*.md
            market_bomb_reconstruction/templates/*.csv
            market_bomb_reconstruction/templates/*.md
            morita_history_reconstruction_gate_audit.md
            input_source_mutation_count.txt
            raw_source_mutation_count.txt
            raw_source_mutation_report.txt
          if-no-files-found: warn

  persist:
    needs: reconstruct
    if: ${{ inputs.persist_reports == true && needs.reconstruct.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout analysis commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download reconstruction artifacts
        uses: actions/download-artifact@v4
        with:
          name: morita-history-reconstruction-${{ github.run_id }}
          path: .

      - name: Verify main did not advance after analysis
        run: |
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "analysis_base_commit_sha=${{ github.sha }}" > market_bomb_reconstruction/audit/persist_status.txt
          echo "current_main_sha=${CURRENT_MAIN_SHA}" >> market_bomb_reconstruction/audit/persist_status.txt
          if [ "${CURRENT_MAIN_SHA}" != "${{ github.sha }}" ]; then
            echo "persist_status=skipped_main_advanced_since_analysis" >> market_bomb_reconstruction/audit/persist_status.txt
            cat market_bomb_reconstruction/audit/persist_status.txt
            exit 0
          fi
          echo "persist_status=ready_to_commit" >> market_bomb_reconstruction/audit/persist_status.txt

      - name: Commit reconstruction outputs
        run: |
          if grep -q "persist_status=skipped_main_advanced_since_analysis" market_bomb_reconstruction/audit/persist_status.txt; then
            echo "Main advanced since analysis; skipping persist commit."
            exit 0
          fi
          git checkout -B main "${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_bomb_reconstruction/source_inventory.* market_bomb_reconstruction/source_file_manifest.csv market_bomb_reconstruction/source_ingestion_audit.md || true
          git add market_bomb_reconstruction/normalized market_bomb_reconstruction/audit market_bomb_reconstruction/analysis market_bomb_reconstruction/templates || true
          git add morita_history_reconstruction_gate_audit.md input_source_mutation_count.txt raw_source_mutation_count.txt raw_source_mutation_report.txt || true
          git diff --cached --quiet || git commit -m "Update Morita history reconstruction outputs"
          git push
