name: Russell1000 Scanner 10:15 JST Status

on:
  schedule:
    # GitHub Actions cron uses UTC. 10:15 JST after a Mon-Fri U.S. session
    # falls on Tue-Sat in Japan.
    - cron: "15 1 * * 2-6"
  workflow_dispatch:

jobs:
  scanner-1015-status:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 10:15 JST scanner status
        env:
          STOCK: ${{ secrets.STOCK }}
          PUSHOVER_ENABLED: ${{ secrets.PUSHOVER_ENABLED }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SCANNER_SCHEDULE_UTC: "15 1 * * 1-5"
        run: python scripts/production_scanner_entry_0430.py

      - name: Upload scanner CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russell1000-1015-scan
          path: |
            scanner_alerts/**/*.csv
            scanner_alerts/**/*.json
          if-no-files-found: ignore
