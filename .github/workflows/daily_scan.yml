name: Daily Russell1000 Scanner

on:
  schedule:
    # 02:30 JST / 04:30 JST intraday checks.
    # GitHub Actions cron uses UTC.
    - cron: "30 17 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "0 22 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scanner
        env:
          STOCK: ${{ secrets.STOCK }}
          PUSHOVER_ENABLED: ${{ secrets.PUSHOVER_ENABLED }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SCANNER_SCHEDULE_UTC: ${{ github.event.schedule }}
        run: python scanner_notify.py

      - name: Upload scanner CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russell1000-daily-scan
          path: scanner_alerts/**/*.csv
          if-no-files-found: ignore
