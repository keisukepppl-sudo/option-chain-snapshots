name: Daily Russell1000 Scanner

on:
  schedule:
    # GitHub Actions cron uses UTC.
    - cron: "0 1 * * 1-5"    # morning_scan_1000_jst / 10:00 JST
    - cron: "15 1 * * 1-5"   # morning_scan_1015_jst / 10:15 JST
    - cron: "30 13 * * 1-5"  # intraday_scan_2230_jst / 22:30 JST
    - cron: "0 14 * * 1-5"   # intraday_scan_2300_jst / 23:00 JST
    - cron: "15 19 * * 1-5"  # pre_close_scan_0415_jst / 04:15 JST
    - cron: "25 19 * * 1-5"  # pre_close_scan_0425_jst / 04:25 JST
    - cron: "30 19 * * 0-4"  # pre_close_scan_0430_jst / 04:30 JST
    - cron: "35 19 * * 1-5"  # pre_close_scan_0435_jst / 04:35 JST
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scanner
        env:
          STOCK: ${{ secrets.STOCK }}
          PUSHOVER_ENABLED: ${{ secrets.PUSHOVER_ENABLED }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SCANNER_SCHEDULE_UTC: ${{ github.event.schedule }}
        run: python scripts/production_scanner_entry_0430.py

      - name: Upload scanner CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russell1000-daily-scan
          path: |
            scanner_alerts/**/*.csv
            scanner_alerts/**/*.json
          if-no-files-found: ignore
