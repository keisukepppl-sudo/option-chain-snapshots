name: Manual Russell1000 Scanner Fallback

on:
  workflow_dispatch:
    inputs:
      slot_et:
        description: "Manual fallback slot"
        required: true
        default: "12:00"
        type: choice
        options:
          - "10:00"
          - "11:30"
          - "12:00"
          - wake

concurrency:
  group: morita-production-scanner-manual
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore manual fallback state
        uses: actions/cache/restore@v4
        with:
          path: .scanner_state
          key: morita-scanner-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            morita-scanner-state-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run manual ET-slot scanner
        env:
          STOCK: ${{ secrets.STOCK }}
          PUSHOVER_ENABLED: ${{ secrets.PUSHOVER_ENABLED }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SCANNER_SCHEDULE_UTC: ""
          SCANNER_SLOT_ET: ${{ inputs.slot_et }}
          SCANNER_STATE_DIR: .scanner_state
        run: python scripts/production_scanner_entry_et_slots.py

      - name: Save manual fallback state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .scanner_state
          key: morita-scanner-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload scanner outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russell1000-manual-scan-${{ github.run_id }}
          path: |
            scanner_alerts/**/*.csv
            scanner_alerts/**/*.json
            .scanner_state/**/*.json
          if-no-files-found: ignore
