name: Daily Russell1000 Scanner

on:
  schedule:
    # 10:00 ET primary/fallback. Both EDT and EST UTC variants are scheduled;
    # scripts/production_scanner_entry_et_slots.py activates only the current offset.
    - cron: "0 14 * * 1-5"
    - cron: "10 14 * * 1-5"
    - cron: "0 15 * * 1-5"
    - cron: "10 15 * * 1-5"

    # 11:30 ET primary/fallback.
    - cron: "30 15 * * 1-5"
    - cron: "40 15 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "40 16 * * 1-5"

    # 12:00 ET primary/fallback. This snapshot becomes the noon execution baseline.
    - cron: "0 16 * * 1-5"
    - cron: "10 16 * * 1-5"
    - cron: "0 17 * * 1-5"
    - cron: "10 17 * * 1-5"

    # 15:15 / 15:25 / 15:30 / 15:35 ET redundant wake checks.
    # Only a current S absent from the 12:00 S+A baseline triggers Emergency Pushover.
    - cron: "15 19 * * 1-5"
    - cron: "25 19 * * 1-5"
    - cron: "30 19 * * 1-5"
    - cron: "35 19 * * 1-5"
    - cron: "15 20 * * 1-5"
    - cron: "25 20 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "35 20 * * 1-5"
  workflow_dispatch:
    inputs:
      slot_et:
        description: "Manual slot to test; auto uses github.event.schedule"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - "10:00"
          - "11:30"
          - "12:00"
          - wake

concurrency:
  group: morita-production-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore scanner notification state
        uses: actions/cache/restore@v4
        with:
          path: .scanner_state
          key: morita-scanner-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            morita-scanner-state-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ET-slot scanner
        env:
          STOCK: ${{ secrets.STOCK }}
          PUSHOVER_ENABLED: ${{ secrets.PUSHOVER_ENABLED }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SCANNER_SCHEDULE_UTC: ${{ github.event.schedule }}
          SCANNER_SLOT_ET: ${{ github.event_name == 'workflow_dispatch' && inputs.slot_et || 'auto' }}
          SCANNER_STATE_DIR: .scanner_state
        run: python scripts/production_scanner_entry_et_slots.py

      - name: Save scanner notification state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .scanner_state
          key: morita-scanner-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload scanner outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: russell1000-daily-scan-${{ github.run_id }}
          path: |
            scanner_alerts/**/*.csv
            scanner_alerts/**/*.json
            .scanner_state/**/*.json
          if-no-files-found: ignore
