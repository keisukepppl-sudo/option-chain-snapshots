name: Daily Flow Engine

on:
  schedule:
    - cron: "45 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy tabulate
      - run: |
          python daily_flow_engine.py --tickers SPY QQQ SOXX SMH MU DRAM --outdir daily_flow_outputs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add daily_flow_outputs
          git commit -m "Update daily flow outputs" || echo "No changes to commit"
          git push
