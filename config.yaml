thresholds:
  min_price: 5.0
  min_avg_volume_50d: 500000
  min_market_cap: 300000000
  breakout_volume_multiple: 1.5
  near_breakout_pct: 0.05
  defensive_down_day_threshold: -0.005
  min_down_days: 5
  vcp_volume_dry_up_multiple: 0.70
  tight_close_pct: 0.05

notify:
  enabled: true
  mode: production_momentum
  universe: russell1000
  universe_cache: cache/russell1000_iwb_holdings.csv
  discord_webhook_env: STOCK
  alert_ranks:
    - S
    - A
    - B
  rule:
    standard_rs_min: 95
    breakout_rs_min: 95
    accumulation_min: 30
    vcp_min: 50
    distance_to_pivot_max: 0.12
  filters:
    min_avg_volume_50d: 2000000
    min_price: 10.0
    min_market_cap_proxy: 2000000000
  backtest_reference:
    source: "Russell1000, 2024-01-01 to 2026-06-13, 20-trading-day cooldown"
    signals: 159
    hit_rate_10pct_20d: 0.515723
    hit_rate_15pct_20d: 0.402516
    hit_rate_20pct_20d: 0.264151
  production:
    rs_min: 98
    breakout_lookback_days: 20
    s_volume_multiple_min: 1.2
    a_volume_multiple_min: 1.2
    volume_strong_flag: 2.0
    volume_extreme_flag: 3.0
    danger_market_cap: 2000000000
    danger_gap_pct: 0.15
    danger_iv: 1.00
    earnings_check_gap_pct: 0.08
    option_liquidity:
      enabled: true
      min_dte: 45
      max_dte: 100
      min_open_interest_per_leg: 100
      max_spread_pct: 0.35

